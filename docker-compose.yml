services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: whatshouldieat
      POSTGRES_DB: whatshouldieat
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whatshouldieat"]
      interval: 5s
      retries: 10

  app:
    build: .
    volumes:
      - ./source:/app
    env_file:
      - ./.env
    ports:
      - "${WHATSHOULDIEAT_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
  
volumes:
  pgdata: {}